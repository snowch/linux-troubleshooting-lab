<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Diagnose Linux failures with real strace running in your browser.">
  <title>{{title}}</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./lab.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to lesson</a>
  <header>
    <div class="header-inner">
      <a href="./" class="brand">{{title}}</a>
      <div class="actions">
        <button type="button" id="theme">Dark theme</button>
        <button type="button" id="offline">Download for offline use</button>
      </div>
    </div>
  </header>
  <p class="offline-status" id="offline-status" role="status" hidden></p>
  <main id="main" class="layout">
    <nav class="lesson-picker" aria-label="Lesson navigation">
      <label for="lesson-picker">Lesson</label>
      <select id="lesson-picker"></select>
    </nav>
    <article aria-labelledby="lesson-title">
      <p class="section-label" id="section"></p>
      <h1 id="lesson-title">{{title}}</h1>
      <p class="lede" id="intro"></p>
      <p id="question" class="question"></p>
      <section aria-labelledby="workbench-heading">
        <h2 id="workbench-heading">Run the experiment</h2>
        <p id="instructions"></p>
        <div class="workspace">
          <div class="toolbar">
            <label for="variant">Case</label>
            <select id="variant">
              <option value="broken">Failing</option>
              <option value="fixed">Repaired</option>
            </select>
            <label for="source">Trace command</label>
            <button type="button" id="restore">Restore command</button>
          </div>
          <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" rows="4"></textarea>
          <div class="toolbar controls">
            <button type="button" id="run" class="primary">Run in Linux</button>
            <button type="button" id="stop" disabled>Interrupt</button>
            <button type="button" id="restart" disabled>Reset Linux</button>
            <span id="runtime-status" role="status">Linux is off</span>
          </div>
          <pre id="terminal" aria-label="Linux console output" tabindex="0">Run in Linux to see the program output and trace.</pre>
          <form id="shell">
            <label for="command">Linux shell</label>
            <input id="command" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" disabled placeholder="Enter a command after Linux boots">
            <button type="submit" disabled>Send</button>
          </form>
        </div>
      </section>
      <section aria-labelledby="change-heading">
        <h2 id="change-heading">Compare the evidence</h2>
        <p id="task"></p>
        <label for="evidence">Evidence and diagnosis</label>
        <textarea id="evidence" rows="4" spellcheck="false"></textarea>
        <details><summary>Hint</summary><p id="hint"></p></details>
        <details><summary>Compare with the worked explanation</summary><p id="explanation"></p></details>
        <p id="transfer" class="question"></p>
        <a id="reference" target="_blank" rel="noopener noreferrer"></a>
      </section>
      <nav id="next-lesson" aria-label="Course progression"></nav>
    </article>
    <noscript>This course needs JavaScript to edit the trace command and boot Linux in WebAssembly.</noscript>
  </main>
  <footer>Runs in an isolated Linux guest on this device. Commands and notes are saved in this browser.</footer>
</body>
</html>
