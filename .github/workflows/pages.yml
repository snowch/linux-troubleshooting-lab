name: Check and deploy lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify real offline guest, saved files and controls
        run: CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())") npm run test:browser
      - name: Retain assets for older open lessons
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PUBLISHED_COURSE_URL: https://snowch.github.io/linux-troubleshooting-lab/
        run: node scripts/retain-for-publish.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
